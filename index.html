<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>Tìm việc · Mini-Upwork</title>
  <link rel="stylesheet" href="/ui/style.css?v=2">
  <script src="/ui/app.js?v=2" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a href="/" class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Mini<span class="brand-accent">Upwork</span></a>
      <nav aria-label="Điều hướng chính" class="navigation">
        <a href="/" aria-current="page">Tìm việc (Phần Đạt)</a>
        <a href="/contracts">Hợp đồng &amp; Thanh toán (Phần Huy)</a>
        <a href="/docs">Tài liệu API</a>
      </nav>
      <span class="connection" id="connection" data-state="loading" role="status">Đang kết nối CSDL</span>
    </div>
  </header>

  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-content">
        <h1 id="page-title">Tìm việc freelance</h1>
        <form id="search-form" class="search" aria-label="Tìm công việc">
          <label class="keyword"><span class="visually-hidden">Từ khóa</span><span class="search-icon" aria-hidden="true"></span><input name="q" type="search" maxlength="200" placeholder="Tìm theo tên công việc hoặc mô tả"></label>
          <button type="submit" class="button button-lime">Tìm việc</button>
        </form>
      </div>
      <div class="hero-art" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </section>

    <div class="marketplace">
      <aside class="filters" aria-labelledby="filters-title">
        <div class="filter-heading">
          <h2 id="filters-title">Bộ lọc</h2>
          <button class="filter-toggle button button-outline" type="button" id="toggle-filters" aria-expanded="false" aria-controls="filter-options">Bộ lọc</button>
          <button class="text-button" type="button" id="clear-filters" hidden>Xóa bộ lọc</button>
        </div>
        <div class="filter-options" id="filter-options" data-expanded="false">
          <label><span id="category-label">Danh mục</span><select name="category_id" id="category" form="search-form" aria-labelledby="category-label"><option value="">Tất cả danh mục</option></select></label>
          <label><span id="skill-label">Kỹ năng</span><select name="skill_id" id="skill" form="search-form" aria-labelledby="skill-label"><option value="">Tất cả kỹ năng</option></select></label>
          <label><span id="job-type-label">Loại công việc</span>
            <select id="job-type" name="job_type" form="search-form" aria-labelledby="job-type-label">
              <option value="">Tất cả loại</option>
              <option value="FIXED_PRICE">Trọn gói</option>
              <option value="HOURLY">Theo giờ</option>
            </select>
          </label>
          <button type="submit" class="button button-outline" form="search-form">Áp dụng</button>
        </div>
      </aside>

      <section class="feed" aria-labelledby="results-title">
        <div class="feed-header">
          <div><h2 id="results-title">Công việc đang mở</h2><p id="result-count" role="status"></p></div>
          <span class="feed-sort" id="feed-sort" hidden>Mới nhất trước</span>
        </div>
        <ul class="active-filters" id="active-filters" aria-label="Bộ lọc đang áp dụng" hidden></ul>
        <p id="search-message" class="notice" role="status" hidden></p>
        <ul id="jobs" class="jobs" aria-label="Kết quả tìm kiếm"></ul>
        <nav class="pagination" aria-label="Trang kết quả" id="pagination" hidden>
          <button type="button" id="previous" class="button button-outline">Trước</button>
          <span id="page-label"></span>
          <button type="button" id="next" class="button button-outline">Tiếp</button>
        </nav>
      </section>
    </div>
  </main>

  <dialog id="job-drawer" class="drawer" aria-labelledby="detail-title">
    <div class="drawer-body">
      <header class="drawer-header"><button type="button" class="text-button back-button" id="close-job" autofocus><span aria-hidden="true">←</span> Quay lại kết quả</button></header>
      <div class="detail">
        <p id="job-meta" class="job-meta" hidden></p>
        <h2 id="detail-title">Chi tiết công việc</h2>
        <p id="detail-message" class="notice" role="status" hidden></p>
        <div id="job-content" hidden>
          <dl class="job-facts">
            <div><dt id="price-label">Ngân sách</dt><dd id="price"></dd></div>
            <div><dt>Khách hàng</dt><dd id="client"></dd></div>
          </dl>
          <section class="detail-section" aria-labelledby="description-title">
            <h3 id="description-title">Mô tả công việc</h3><p id="description" class="description"></p>
          </section>
          <section class="detail-section" aria-labelledby="skills-title">
            <h3 id="skills-title">Kỹ năng yêu cầu</h3><ul id="job-skills" class="skills"></ul>
          </section>
          <button type="button" id="show-proposal" class="button button-green" aria-controls="proposal-form">Soạn đề xuất</button>
          <form id="proposal-form" class="proposal" aria-labelledby="proposal-title" hidden>
            <h3 id="proposal-title">Đề xuất của bạn</h3>
            <div class="proposal-fields">
              <label><span id="freelancer-label">Tài khoản demo</span><select id="freelancer" name="freelancer" aria-labelledby="freelancer-label" required><option value="">Chọn freelancer</option></select></label>
              <label><span id="offer-label">Mức đề xuất (USD)</span><input id="offer" name="offer" type="number" min="0.01" max="9999999999.99" step="0.01" placeholder="0,00" required></label>
            </div>
            <label>Thư giới thiệu<textarea id="letter" name="letter" rows="4" maxlength="10000" required></textarea></label>
            <button type="submit" id="send" class="button button-green">Gửi đề xuất</button>
            <p id="proposal-message" class="notice" role="status" hidden></p>
          </form>
        </div>
      </div>
    </div>
  </dialog>
</body>
</html>
